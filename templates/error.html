{% extends "base.html" %}
{% block title %}{{ t('error') }}{% endblock %}
{% block content %}
<div class="text-center py-5">
    <i class="bi bi-exclamation-triangle" style="font-size: 4em; color: #dc3545;"></i>
    <h3 class="mt-3">{{ message|default('Произошла ошибка') }}</h3>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary mt-3">
        <i class="bi bi-house"></i> На главную
    </a>
</div>
{% endblock %}
