{% extends "base.html" %}

{% block title %}{{ t('login_title') }} — Synaqmaker Resolver{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-display" style="font-size: 3em; color: #0dcaf0;"></i>
                    <h3 class="mt-2">Synaqmaker Resolver</h3>
                    <p class="text-muted">{{ t('login_title') }}</p>
                </div>
                <form method="POST" action="{{ url_for('login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="password" class="form-label">{{ t('login_password') }}</label>
                        <input type="password" class="form-control" id="password" name="password" 
                               placeholder="••••••••" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> {{ t('login') }}
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
